appId: com.fegter.writer
productName: Writer
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - src/**
  - app/**
  - package.json
extraResources:
  - from: bin
    to: bin
publish:
  provider: github
  releaseType: release
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: Dictation listens through the microphone.
    NSSpeechRecognitionUsageDescription: Dictation turns speech into text on this Mac.
dmg:
  sign: false
afterAllArtifactBuild: scripts/zip-dmg.js
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
